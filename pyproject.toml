[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "itpeval"
version = "0.1.0"
requires-python = ">=3.10"
description = "ITP toolchain manager and proof verifier"
authors = [
    { name = "Jiayi Wu", email = "jiayi_wu4@brown.edu" },
    { name = "Robert Joseph George" },
    { name = "Anima Anandkumar" },
]
license = { file = "LICENSE" }
dependencies = [
    "anthropic",
    "google-genai",
    "httpx",
    "openai",
    "python-dotenv",
    "requests",
]

[tool.setuptools.packages.find]
include = ["eval*", "itpeval*"]

[tool.setuptools.package-data]
eval = ["data/*.json", "data/*.jsonl"]

[project.scripts]
itpeval = "itpeval.cli.main:main"
