[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "itpeval"
version = "0.1.0"
requires-python = ">=3.10"
description = "ITP toolchain manager and proof verifier"
authors = [
    { name = "Jiayi Wu", email = "jiayi_wu4@brown.edu" },
    { name = "Robert Joseph George" },
    { name = "Anima Anandkumar" },
]
license = { file = "LICENSE" }
dependencies = [
    "anthropic",
    "google-genai",
    "httpx",
    "openai",
    "python-dotenv",
    "requests",
]

[tool.setuptools.packages.find]
include = ["eval*", "itpeval*"]

[tool.setuptools.package-data]
eval = [
    "data/*.json",
    "data/*.jsonl",
    "pipeline/proof_transfer/manifests/*.json",
    "pipeline/hol_light_to_isabelle/babel_formal_pipeline/manifests/*.json",
    "pipeline/hol_light_to_isabelle/hundred_theorems_pipeline/manifests/*.json",
    "configs/hol_light_to_isabelle/*.example.json",
    "configs/inference/*.example.json",
    "pipeline/hol_light_to_isabelle/babel_formal_pipeline/v2_dsp/UPSTREAM_LICENSE.txt",
    "pipeline/hol_light_to_isabelle/babel_formal_pipeline/v2_dsp/native/ROOT",
    "pipeline/hol_light_to_isabelle/babel_formal_pipeline/v2_dsp/native/*.thy",
    "pipeline/hol_light_to_isabelle/babel_formal_pipeline/v2_dsp/native/*.ML",
    "pipeline/hol_light_to_isabelle/babel_formal_pipeline/v2_dsp/native/*.json",
    "pipeline/hol_light_to_isabelle/babel_formal_pipeline/v2_dsp/README.md",
    "pipeline/hol_light_to_isabelle/babel_formal_pipeline/README.md",
    "pipeline/hol_light_to_isabelle/hundred_theorems_pipeline/README.md",
    "pipeline/hol_light_to_isabelle/README.md",
]

[project.optional-dependencies]
# Kept as an empty compatibility extra; native Isabelle2026 needs no PISA/gRPC packages.
isabelle-dsp = []

[project.scripts]
itpeval = "itpeval.cli.main:main"
